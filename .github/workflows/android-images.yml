name: Android SDK Docker Images

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "sdk/**"
      - ".github/workflows/android-images.yml"
      - ".cirrus.yml"

permissions:
  contents: read

concurrency:
  group: android-sdk-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-images:
    name: Build Android SDK images
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tools
            context: sdk/tools
            tag: android-sdk:tools
          - name: sdk-36
            context: sdk/36
            tag: android-sdk:36
          - name: sdk-36-ndk
            context: sdk/36-ndk
            tag: android-sdk:36-ndk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: false
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Confirm image definition exists
        shell: bash
        run: |
          test -f "${{ matrix.context }}/Dockerfile"
